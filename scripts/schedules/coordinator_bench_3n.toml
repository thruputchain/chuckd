name = "coordinator_bench_3n"

[[jobs]]
name = "{{ .hog_schedule }}_{{ .hog_host_key }}_of_{{ .hog_host_count }}"
script = """

git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --quiet --no-progress
git checkout {{ .git_commit }}

source ./scripts/setup_go.sh
./scripts/build_chuckd.sh

source ./scripts/setup_cargo.sh
./scripts/build_scpd.sh

# start benchmark

METRIC="coordinator" \
LABEL="3n" \
HOST="${HOG_HOST}" \
NODE="{{ .hog_host_key }}-of-{{ .hog_host_count }}" \
HOST_JOBS_DIR="./scripts/schedules/host_jobs" \
./scripts/schedules/blue/launch_with_metrics.sh ./chuckd.dev ./scpd.dev

"""
after = """
killall scpd.dev chuckd.dev || true
"""

[jobs.host]
1 = "hog6"
2 = "hog7"
3 = "hog8"

[jobs.env]
GIT_REPO = "{{ .github_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
