name = "coordinator_bench_3n"

[[jobs]]
name = "{{ .hog_schedule }}_{{ .hog_host_index_plus1 }}_of_{{ .hog_host_count }}"
host = ["hog6", "hog7", "hog8"]
script = """

git clone --depth 1 git@github.com:groundhogchain/chuckd.git

source ./chuckd/scripts/setup_go.sh
./chuckd/scripts/build_chuckd.sh

source ./chuckd/scripts/setup_cargo.sh
./chuckd/scripts/build_scpd.sh

# start benchmark

sed \
    -e "s/{--METRIC--}/coordinator/g" \
    -e "s/{--LABEL--}/3n/g" \
    -e "s/{--HOST--}/${HOG_HOST}/g" \
    -e "s/{--NODE--}/node-{{ .hog_host_index_plus1 }}-of-{{ .hog_host_count }}/g" \
    ./chuckd/scripts/templates/bench_with_metrics.sh | \
    bash -s -- ./chuckd.dev ./scpd.dev

"""
after = """
killall scpd.dev chuckd.dev || true
"""

[jobs.env]
GIT_COMMIT = "{{ .git_commit }}"
