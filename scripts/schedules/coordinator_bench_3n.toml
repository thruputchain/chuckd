name = "coordinator_bench_3n"

[[jobs]]
name = "{{ .hog_schedule }}_{{ .hog_host_index_plus1 }}_of_{{ .hog_host_count }}"
host = ["hog6", "hog7", "hog8"]
script = """

git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }}
git checkout {{ .git_commit }}

source ./scripts/setup_go.sh
./scripts/build_chuckd.sh

source ./scripts/setup_cargo.sh
./scripts/build_scpd.sh

# start benchmark

sed \
    -e "s/{--METRIC--}/coordinator/g" \
    -e "s/{--LABEL--}/3n/g" \
    -e "s/{--HOST--}/${HOG_HOST}/g" \
    -e "s/{--NODE--}/node-{{ .hog_host_index_plus1 }}-of-{{ .hog_host_count }}/g" \
    ./scripts/schedules/blue/launch_with_metrics.sh | \
    HOST_JOBS_DIR="./scripts/schedules/host_jobs" bash -s -- ./chuckd.dev ./scpd.dev

"""
after = """
killall scpd.dev chuckd.dev || true
"""

[jobs.env]
GIT_COMMIT = "{{ .git_commit }}"
