name = "dogwood_bench_300k"

[[jobs]]
name = "{{ .hog_schedule }}_{{ .hog_host_index_plus1 }}_of_{{ .hog_host_count }}"
host = ["hog7", "hog8"]
script = """

git config --global protocol.version 2
git clone --depth 1 git@github.com:groundhogchain/chuckd.git

source ./chuckd/scripts/setup_go.sh

root=$(pwd)
cd chuckd/chuckd
go build
mv ./chuckd $root/chuckd.dogwood_bench
cd $root

sed \
    -e "s/{--METRIC--}/dogwood/g" \
    -e "s/{--LABEL--}/300k/g" \
    -e "s/{--HOST--}/${HOG_HOST}/g" \
    -e "s/{--NODE--}/node-{{ .hog_host_index_plus1 }}-of-{{ .hog_host_count }}/g" \
    ./chuckd/scripts/templates/bench_with_metrics.sh | \
    bash -s -- ./chuckd.dogwood_bench

"""

[jobs.env]
GIT_COMMIT = "{{ .git_commit }}"
