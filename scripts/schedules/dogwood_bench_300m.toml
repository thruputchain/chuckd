name = "dogwood_bench_300m"

[[jobs]]
name = "dogwood_bench_300m_1_of_3"
host = "hog6"
script = """

git config --global protocol.version 2
git clone --depth 1 git@github.com:groundhogchain/chuckd.git

source ./chuckd/scripts/setup_go.sh

root=$(pwd)
cd chuckd/chuckd
go build
mv ./chuckd $root/chuckd.dogwood_bench
cd $root

sed \
    -e "s/{--LABEL--}/300m/g" \
    -e "s/{--HOST--}/${HOG_HOST}/g" \
    -e "s/{--NODE--}/node-1-of-3/g" \
    ./chuckd/scripts/templates/dogwood_bench.sh.tmpl | bash

"""

