name = "dogwood_bench_30m"

[[jobs]]
name = "{{ .hog_schedule }}_{{ .hog_host_index_plus1 }}_of_{{ .hog_host_count }}"
host = ["hog6", "hog7", "hog8"]
script = """

echo "job home directory $HOME"
echo "ssh agent forwards:"
ssh-add -l

git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --quiet --no-progress
git checkout {{ .git_commit }}

source ./scripts/setup_go.sh
./scripts/build_chuckd.sh

sed \
    -e "s/{--METRIC--}/dogwood/g" \
    -e "s/{--LABEL--}/30m/g" \
    -e "s/{--HOST--}/${HOG_HOST}/g" \
    -e "s/{--NODE--}/{{ .hog_host_index_plus1 }}-of-{{ .hog_host_count }}/g" \
    ./scripts/schedules/blue/launch_with_metrics.sh | \
    HOST_JOBS_DIR="./scripts/schedules/host_jobs" bash -s -- ./chuckd.dev

"""

[jobs.env]
GIT_COMMIT = "{{ .git_commit }}"
