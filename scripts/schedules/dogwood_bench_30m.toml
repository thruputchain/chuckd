name = "dogwood_bench_30m"

[[jobs]]
name = "{{ .hog_schedule }}_{{ .hog_host_index_plus1 }}_of_{{ .hog_host_count }}"
host = ["hog6", "hog7", "hog8"]
script = """

git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --quiet --no-progress
git checkout {{ .git_commit }}

source ./scripts/setup_go.sh
./scripts/build_chuckd.sh

METRIC="dogwood" \
LABEL="30m" \
HOST="${HOG_HOST}" \
NODE="{{ .hog_host_index_plus1 }}-of-{{ .hog_host_count }}" \
HOST_JOBS_DIR="./scripts/schedules/host_jobs" \
./scripts/schedules/blue/launch_with_metrics.sh ./chuckd.dev

"""

[jobs.env]
GIT_REPO = "{{ .github_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
