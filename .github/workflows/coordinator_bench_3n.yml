name: Coordinator benchmark 3 nodes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: self-hosted
    steps:
      - name: Clean up .gitconfig
        run: |
          echo "Cleaning up .gitconfig"
          rm -f /home/hogci/.gitconfig

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.CHUCKD_TO_CHUCKD_KEY }}
            ${{ secrets.CHUCKD_TO_LIB_GO_KEY }}
            ${{ secrets.CHUCKD_TO_PROTOCOL_KEY }}
            ${{ secrets.CHUCKD_TO_PROTOCOL_GO_KEY }}
            ${{ secrets.CHUCKD_TO_METRICS_HISTORY_KEY }}
            ${{ secrets.CHUCKD_TO_SCP_KEY }}
            ${{ secrets.CHUCKD_TO_PROTOCOL_RS_KEY }}
            ${{ secrets.CHUCKD_TO_XDRS_KEY }}
            ${{ secrets.CHUCKD_TO_XDR_COMMON_KEY }}
            ${{ secrets.CHUCKD_TO_XDR_RPC_KEY }}
            ${{ secrets.CHUCKD_TO_SERDE_ARRAYS_KEY }}

      - uses: actions/checkout@v4

      - name: Run hog schedule
        run: |
          hog_sched \
            --i="github-${{ github.run_id }}" \
            --key=github_repo --value=${{ github.repository }} \
            --key=git_commit --value=${{ github.sha }} \
            --key=git_branch --value=${{ github.head_ref || github.ref_name }} \
            ./scripts/schedules/coordinator_bench_3n.toml
