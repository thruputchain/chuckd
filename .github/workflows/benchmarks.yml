name: Benchmarks

# Starts the Dogwood benchmark runs for each push to main. The runs themselves
# happen in the private thruputchain/benchmarks repository, on its benchmark
# cluster; this job only asks for them, on a GitHub-hosted runner. The
# schedules live there under chuckd/; the per-host job scripts they run stay
# here under scripts/schedules/host_jobs/.
#
# It dispatches as a GitHub App whose only permission is Actions: read and
# write, installed only on thruputchain/benchmarks. Its client ID and key
# (GEOPHREY_CLIENT_ID, GEOPHREY_CLIENT_KEY) are secrets of the `benchmarks`
# environment, whose deployment branches are limited to main, so only
# workflows already merged to main can use them; a workflow on any other
# branch or a fork PR never sees them. The App's runs show as <app>[bot]: the
# benchmarks repository accepts them only for chuckd main commits. See
# chuckd/README.md in that repository.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch Dogwood benchmarks
    # Forks have no App key and no business starting runs.
    if: github.repository == 'thruputchain/chuckd'
    environment: benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint dispatch token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GEOPHREY_CLIENT_ID }}
          private-key: ${{ secrets.GEOPHREY_CLIENT_KEY }}
          owner: thruputchain
          repositories: benchmarks
          permission-actions: write

      - name: Dispatch the Dogwood benchmarks
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ github.sha }}
        run: |
          # The REST dispatch endpoint needs only Actions: write. `gh workflow
          # run` would first look up the default branch, which needs Contents.
          for workflow in chuckd-dogwood-bench-30m chuckd-dogwood-bench-300m chuckd-dogwood-bench-300k; do
            gh api --method POST \
              "repos/thruputchain/benchmarks/actions/workflows/$workflow.yml/dispatches" \
              -f ref=main -f "inputs[sha]=$SHA"
            echo "Dispatched $workflow for $SHA (thruputchain/benchmarks)" >> "$GITHUB_STEP_SUMMARY"
          done
