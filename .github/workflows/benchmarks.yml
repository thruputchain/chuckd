name: Benchmarks

# Starts the Dogwood benchmark runs for each push to main. The runs happen
# elsewhere; this job only asks for them, on a GitHub-hosted runner, as a
# GitHub App whose only permission is Actions: read and write. Its client ID
# and key are secrets of the `benchmarks` environment, whose deployment
# branches are limited to main, so only workflows already merged to main can
# use them; a workflow on any other branch or a fork PR never sees them.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch Dogwood benchmarks
    # Forks have no App key and no business starting runs.
    if: github.repository == 'thruputchain/chuckd'
    environment: benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Until the environment holds the App's credentials there is nothing
      # to dispatch with; say so and stop rather than fail every push.
      - name: Check for the dispatch App
        id: configured
        env:
          CLIENT_ID: ${{ secrets.GEOPHREY_CLIENT_ID }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::notice::GEOPHREY_CLIENT_ID is not set in the benchmarks environment; skipping the benchmark dispatch"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint dispatch token
        id: app
        if: steps.configured.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GEOPHREY_CLIENT_ID }}
          private-key: ${{ secrets.GEOPHREY_CLIENT_KEY }}
          owner: thruputchain
          repositories: benchmarks
          permission-actions: write

      - name: Dispatch the Dogwood benchmarks
        if: steps.configured.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ github.sha }}
        run: |
          # The REST dispatch endpoint needs only Actions: write. `gh workflow
          # run` would first look up the default branch, which needs Contents.
          for workflow in chuckd-dogwood-bench-30m chuckd-dogwood-bench-300m chuckd-dogwood-bench-300k; do
            gh api --method POST \
              "repos/thruputchain/benchmarks/actions/workflows/$workflow.yml/dispatches" \
              -f ref=main -f "inputs[sha]=$SHA"
            echo "Dispatched $workflow for $SHA (thruputchain/benchmarks)" >> "$GITHUB_STEP_SUMMARY"
          done
