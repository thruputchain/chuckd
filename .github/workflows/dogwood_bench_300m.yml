name: Dogwood benchmark 300m

# Runs on self-hosted bench hardware with repository secrets, so it is
# dispatched manually rather than triggered by pushes or pull requests: a
# public repository must not run untrusted pull-request code on self-hosted
# runners.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: self-hosted
    steps:
      - name: Clean up .gitconfig
        run: |
          echo "Cleaning up .gitconfig"
          rm -f /home/hogci/.gitconfig

      - uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.CHUCKD_TO_CHUCKD_KEY }}
            ${{ secrets.CHUCKD_TO_LIB_GO_KEY }}
            ${{ secrets.CHUCKD_TO_PROTOCOL_GO_KEY }}
            ${{ secrets.CHUCKD_TO_METRICS_HISTORY_KEY }}

      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4

      - name: Run hog schedule
        run: |
          hog_sched \
            --i="${{ github.event.repository.name }}-${{ github.run_id }}" \
            --key=github_repo --value=${{ github.repository }} \
            --key=git_commit --value=${{ github.sha }} \
            --key=git_branch --value=${{ github.head_ref || github.ref_name }} \
            --key=read_access_pat --value=${{ secrets.READ_ACCESS_PAT }} \
            ./scripts/schedules/dogwood_bench_300m.toml
