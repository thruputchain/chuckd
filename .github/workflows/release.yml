name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/coordinator-build.yml'
      - '.github/workflows/component-build.yml'
      - '.github/scripts/write-build-measurement.py'
      - '.github/tests/**'
      - 'scripts/build_chuckd.sh'
      - 'scripts/build_scpd.sh'
      - 'scripts/package_coordinator.sh'

permissions:
  contents: read

jobs:
  workflow-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4
        with:
          persist-credentials: false
      - name: Test component publication contracts
        run: |
          test -f .github/tests/test_component_build.py
          python3 -m unittest discover -s .github/tests -p 'test_*.py'

  # The version a tagged release embeds is the tag without its leading v. A
  # pull request that exercises these workflows gets a development version
  # instead, so nothing it builds can pass for a release.
  version:
    runs-on: ubuntu-24.04
    outputs:
      component_version: ${{ steps.version.outputs.component_version }}
    steps:
      - id: version
        name: Derive the component version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            version="${REF_NAME#v}"
            # Semantic versions only: digits with an optional prerelease, as
            # scripts/build_chuckd.sh and the packaging contract expect.
            if [[ "$REF_NAME" != v* || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::release tag $REF_NAME is not v<major>.<minor>.<patch>[-<prerelease>]"
              exit 1
            fi
          else
            version="0.0.0-pr${PR_NUMBER}.g${SHA:0:12}"
          fi
          echo "component_version=$version" >> "$GITHUB_OUTPUT"
          echo "Component version: $version" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [workflow-tests, version]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/coordinator-build.yml
    with:
      source_commit: ${{ github.sha }}
      component_version: ${{ needs.version.outputs.component_version }}
    secrets:
      READ_ACCESS_PAT: ${{ secrets.READ_ACCESS_PAT }}

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: namespace-profile-chuckd-rs-linux
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: chuckd-linux-x86_64-release-artifact
          path: artifacts/

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: chuckd-linux-arm64-release-artifact
          path: artifacts/

      - name: Generate aggregate checksums
        run: |
          set -euo pipefail
          cd artifacts
          test -s chuckd-coordinator-linux-x86_64.tar.gz
          test -s chuckd-coordinator-linux-arm64.tar.gz
          test -s chuckd-coordinator-debuginfo-linux-x86_64.tar.gz
          test -s chuckd-coordinator-debuginfo-linux-arm64.tar.gz
          archives=(*.tar.gz)
          test "${#archives[@]}" -eq 4
          sha256sum -- *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
