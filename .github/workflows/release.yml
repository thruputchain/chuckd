name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/coordinator-build.yml'
      - '.github/scripts/write-build-measurement.py'

permissions:
  contents: read

jobs:
  build:
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/coordinator-build.yml
    with:
      source_commit: ${{ github.sha }}
      component_version: 0.1.25-rc.4
    secrets: inherit

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: namespace-profile-chuckd-rs-linux
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: chuckd-linux-x86_64-release-artifact
          path: artifacts/

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: chuckd-linux-arm64-release-artifact
          path: artifacts/

      - name: Generate aggregate checksums
        run: |
          set -euo pipefail
          cd artifacts
          test -s chuckd-coordinator-linux-x86_64.tar.gz
          test -s chuckd-coordinator-linux-arm64.tar.gz
          sha256sum -- *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
