name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

permissions:
  contents: write

jobs:
  release:
    runs-on: namespace-profile-chuckd-rs-linux
    steps:
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.CHUCKD_TO_CHUCKD_KEY }}
            ${{ secrets.CHUCKD_TO_LIB_GO_KEY }}
            ${{ secrets.CHUCKD_TO_PROTOCOL_GO_KEY }}
            ${{ secrets.CHUCKD_TO_METRICS_HISTORY_KEY }}
            ${{ secrets.CHUCKD_TO_SCP_KEY }}
            ${{ secrets.CHUCKD_TO_HOGX_KEY }}

      - uses: namespacelabs/nscloud-checkout-action@v8
        with:
          submodules: false

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable

      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: go

      - name: Set up Go private modules
        run: |
          go env -w GOPRIVATE=github.com/groundhogchain/*
          go env -w GONOSUMDB=github.com/groundhogchain/*
          go env -w GONOPROXY=github.com/groundhogchain/*
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Build chuckd
        run: ./scripts/build_chuckd.sh

      - name: Build scpd
        run: ./scripts/build_scpd.sh

      - name: Package coordinator
        run: |
          set -euo pipefail

          package_dir="chuckd-coordinator-linux-x86_64"
          mkdir -p "$package_dir"
          install -m 0755 chuckd.dev "$package_dir/chuckd"
          install -m 0755 scpd.dev "$package_dir/scpd"
          tar -C "$package_dir" -czf "${package_dir}.tar.gz" chuckd scpd
          sha256sum "${package_dir}.tar.gz" > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chuckd-coordinator-linux-x86_64.tar.gz
            SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
