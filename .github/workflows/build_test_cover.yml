name: Build, test, cover

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A one-minute Go build and test; it needs no bench hardware, so it runs on
  # Namespace instead of queueing behind hog_sched benchmarks on hog1.
  build-test:
    runs-on: namespace-profile-chuckd-rs-linux
    steps:
      # The Go modules are public, so no credentials: the proxy serves them.
      - uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: go

      - name: Build
        run: go build ./...

      - name: Test with coverage
        run: go test ./... -covermode=atomic -coverprofile=coverage.out

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
