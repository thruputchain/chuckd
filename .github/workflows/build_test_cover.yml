name: Build, test, cover

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build-test:
        runs-on: self-hosted
        steps:
            - name: Run hog schedule
              run: |
                  export SSH_AUTH_SOCK="$HOME/.ssh/ssh_auth_sock"
                  eval "$(ssh-agent -s -a "$SSH_AUTH_SOCK")"
                  echo ${{ secrets.CHUCKD_TO_CHUCKD_KEY }} | ssh-add -
                  echo ${{ secrets.CHUCKD_TO_PROTOCOL_GO_KEY }} | ssh-add -
                  echo ${{ secrets.CHUCKD_TO_METRICS_HISTORY_KEY }} | ssh-add -

                  git clone --depth 1 git@github.com:groundhogchain/chuckd.git

                  echo $(which hog_sched)
                  hog_sched \
                    --i="github-${{ github.run_id }}" \
                    --key=git_commit --value=${{ github.sha }}
                    ./scripts/schedules/build_test_cover.toml

            - name: Upload coverage artifact
              uses: actions/upload-artifact@v4
              with:
                  name: coverage
                  path: coverage.out
