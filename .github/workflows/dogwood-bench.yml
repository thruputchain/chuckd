name: Dogwood benchmark

on:
    push:
        branches: ["main"]
    workflow_dispatch:

jobs:
    bench_node_1_of_2:
        runs-on: hog7
        env:
            GOPRIVATE: github.com/groundhogchain/*
            GONOSUMDB: github.com/groundhogchain/*
            GONOPROXY: github.com/groundhogchain/*
        steps:
            - name: Clean up .gitconfig
              run: |
                  echo "Cleaning up .gitconfig"
                  rm -f /home/hogci/.gitconfig

            - uses: webfactory/ssh-agent@v0.9.1
              with:
                  ssh-private-key: |
                      ${{ secrets.CHUCKD_TO_PROTOCOL_GO_KEY }}

            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Configure Git to use SSH for GitHub
              run: |
                  git config --global url."git@github.com:".insteadOf "https://github.com/"

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod

            - name: Cache Go modules
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
                  restore-keys: |
                      ${{ runner.os }}-go-

            - name: Verify build
              run: pwd; go build ./...

