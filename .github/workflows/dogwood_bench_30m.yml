name: Dogwood benchmark 30m

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: self-hosted
    steps:
      - name: Clean up .gitconfig
        run: |
          echo "Cleaning up .gitconfig"
          rm -f /home/hogci/.gitconfig

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.CHUCKD_TO_CHUCKD_KEY }}
            ${{ secrets.CHUCKD_TO_LIB_GO_KEY }}
            ${{ secrets.CHUCKD_TO_PROTOCOL_GO_KEY }}
            ${{ secrets.CHUCKD_TO_METRICS_HISTORY_KEY }}

      - uses: actions/checkout@v4

      - name: Run hog schedule
        run: |
          hog_sched \
            --i="${{ github.event.repository.name }}-${{ github.run_id }}" \
            --key=github_repo --value=${{ github.repository }} \
            --key=git_commit --value=${{ github.sha }} \
            --key=git_branch --value=${{ github.head_ref || github.ref_name }} \
            --key=read_access_pat --value=${{ secrets.READ_ACCESS_PAT }} \
            ./scripts/schedules/dogwood_bench_30m.toml
