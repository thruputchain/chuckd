name: Dogwood benchmark 30MB

on:
    push:
        branches: ["main"]
    workflow_dispatch:

jobs:
    bench_node_1_of_3:
        runs-on: hog6
        env:
            GOPRIVATE: github.com/groundhogchain/*
            GONOSUMDB: github.com/groundhogchain/*
            GONOPROXY: github.com/groundhogchain/*
        steps:
            - name: Clean up working directory and .gitconfig
              run: |
                  rm -rf *
                  echo "Cleaning up .gitconfig"
                  rm -f /home/hogci/.gitconfig

            - uses: webfactory/ssh-agent@v0.9.1
              with:
                  ssh-private-key: |
                      ${{ secrets.CHUCKD_TO_PROTOCOL_GO_KEY }}
                      ${{ secrets.CHUCKD_TO_METRICS_HISTORY_KEY }}

            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Configure Git to use SSH for GitHub
              run: |
                  git config --global url."git@github.com:".insteadOf "https://github.com/"

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod

            - name: Cache Go modules
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
                  restore-keys: |
                      ${{ runner.os }}-go-

            - name: Build executable
              # runs in: /home/local/hogci/actions-runner/_work/chuckd/chuckd
              run: |
                  go build -o ./chuckd-ci ./chuckd

            # benchmark + metrics capture

            - name: clone metrics history
              run: ./scripts/clone_metrics_history.sh

            - name: Run benchmark
              run: |
                  source ./scripts/git_info.sh
                  ./metrics_history/scripts/make_metric_file.sh dogwood-30m-node_1_of_3 $GIT_branch $GIT_commit $GIT_commit_time
                  ./scripts/dogwood_bench/hosts\=3\,pay\=30m/dogwood_bench.hog6.sh ./chuckd-ci > \
                        ./metrics_history/metrics/dogwood-30m-node_1_of_3/$GIT_branch/${GIT_commit_time}_$GIT_commit
              shell: bash

            - name: commit metrics
              run: ./scripts/commit_metrics.sh

