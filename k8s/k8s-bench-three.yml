apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chuckd-bench
spec:
  serviceName: "chuckd-bench"
  replicas: 3
  selector:
    matchLabels:
      app: chuckd-bench
  template:
    metadata:
      labels:
        app: chuckd-bench
    spec:
      containers:
      - name: chuckd-bench
        image: groundhogchain:chuckd.latest
        imagePullPolicy: IfNotPresent
        command:
        - "/bin/sh"
        - "-c"
        - |
          source /app/config/env.sh
          exec /app/chuckd -v --config=/app/config/config.json --instance $INSTANCE --seed $SEED bench broadcast --addr 0.0.0.0:9111 --fanout 5 --iterations 3 --payperchan 10 --paysize 100
        env:
        - name: INSTANCE
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
        ports:
        - containerPort: 9111
          name: app
        - containerPort: 2222
          name: metrics
      initContainers:
      - name: config-setup
        image: busybox
        command:
        - sh
        - -c
        - |
          POD_NAME=$(echo $HOSTNAME | awk -F- '{print $NF}')
          POD_INDEX=$((POD_NAME+1))
          cp /configs/config-$POD_INDEX/config.json /target/config.json
          # Set SEED environment variable based on pod index
          if [ "$POD_INDEX" = "1" ]; then
            echo "export SEED=1000" > /target/env.sh
          elif [ "$POD_INDEX" = "2" ]; then
            echo "export SEED=2000" > /target/env.sh
          elif [ "$POD_INDEX" = "3" ]; then
            echo "export SEED=3000" > /target/env.sh
          fi
          # Set INSTANCE environment variable 
          echo "export INSTANCE=bench-$POD_INDEX" >> /target/env.sh
        volumeMounts:
        - name: config-volume
          mountPath: /target
        - name: config-1
          mountPath: /configs/config-1
        - name: config-2
          mountPath: /configs/config-2
        - name: config-3
          mountPath: /configs/config-3
      volumes:
      - name: config-volume
        emptyDir: {}
      - name: config-1
        configMap:
          name: chuckd-bench-config-1
      - name: config-2
        configMap:
          name: chuckd-bench-config-2
      - name: config-3
        configMap:
          name: chuckd-bench-config-3
---
apiVersion: v1
kind: Service
metadata:
  name: chuckd-bench-1
spec:
  selector:
    app: chuckd-bench
    statefulset.kubernetes.io/pod-name: chuckd-bench-0
  ports:
  - port: 9111
    name: app
  - port: 2222
    name: metrics
---
